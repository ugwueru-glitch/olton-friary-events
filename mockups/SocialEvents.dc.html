<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social Events</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.scroller{scrollbar-color:#F5B82E #FDF1D3;scrollbar-width:auto}
</style>
</helmet>
<div style="height: 100vh; min-height: 480px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Atkinson Hyperlegible', sans-serif; color: #231A33">
  <div style="background: #F5B82E; color: #231A33; display: flex; justify-content: center; padding: 1rem">
    <div style="width: 100%; max-width: 46rem; display: flex; align-items: center; gap: 0.75rem">
      <a href="Main.dc.html" aria-label="Back to home" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; flex: none">
        <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#231A33" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 32px; font-weight: 700; line-height: 1.2">Social Events</h1>
    </div>
  </div>
  <div style="display: flex; justify-content: center; padding: 1rem; border-bottom: 1px solid #D8D4E0">
    <div style="width: 100%; max-width: 46rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem">
      <div style="display: flex; border: 2px solid #231A33; border-radius: 26px; overflow: hidden">
        <button onClick="{{showWeeks}}" style="height: 48px; width: 96px; border: 0; font-size: 19px; font-weight: 700; color: #231A33; background: {{weekBg}}">Week</button>
        <button onClick="{{showMonths}}" style="height: 48px; width: 96px; border: 0; font-size: 19px; font-weight: 700; color: #231A33; background: {{monthBg}}">Month</button>
      </div>
      <div style="display: flex; align-items: center; gap: 0.5rem; flex: 1 1 18rem; justify-content: flex-end">
        <button onClick="{{previous}}" aria-label="Earlier" style="width: 48px; height: 48px; flex: none; border: 0; border-radius: 24px; background: #FDF1D3; display: flex; align-items: center; justify-content: center; visibility: {{prevVisible}}">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#231A33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>
        <div style="font-size: 20px; font-weight: 700; text-align: center; flex: 1 1 auto">{{periodLabel}}</div>
        <button onClick="{{next}}" aria-label="Later" style="width: 48px; height: 48px; flex: none; border: 0; border-radius: 24px; background: #FDF1D3; display: flex; align-items: center; justify-content: center; visibility: {{nextVisible}}">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#231A33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="scroller" style="flex: 1 1 0; min-height: 0; overflow-y: scroll; display: flex; flex-direction: column; align-items: center; padding: 0 1rem">
    <div style="width: 100%; max-width: 46rem; padding-bottom: 2rem">
      <sc-for list="{{days}}" as="day" hint-placeholder-count="3">
        <div style="padding-top: 1.5rem">
          <h2 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.3; color: #231A33">{{day.heading}}</h2>
          <sc-for list="{{day.events}}" as="event" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 1rem; padding: 0.75rem 0; border-bottom: 1px solid #E8E4EE">
              <div style="flex: 0 0 5.25rem; font-size: 20px; font-weight: 700; line-height: 1.4">{{event.time}}</div>
              <div style="flex: 1 1 0; min-width: 0">
                <div style="font-size: 20px; line-height: 1.4">{{event.title}}</div>
                <sc-if value="{{event.note}}" hint-placeholder-val="{{ false }}">
                  <div style="font-size: 18px; line-height: 1.4; color: #5B5368">{{event.note}}</div>
                </sc-if>
              </div>
              <div style="flex: none; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center">
                <span aria-hidden="true" style="font-size: 46px; line-height: 1">{{event.emoji}}</span>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-for>
      <p style="margin: 1.5rem 0 0; font-size: 18px; line-height: 1.4; color: #5B5368">Last updated 1 November 2026. Unofficial site. Events come from oltonfriary.org.uk</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
const TODAY = '2026-11-01';
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const DAYS = [
  { date: '2026-11-01', events: [{ time: '3:00pm', title: 'Bereavement Support Group', note: 'Until 4:30pm. Friary Lounge', emoji: '🤝' }] },
  { date: '2026-11-04', events: [{ time: '7:00pm', title: 'Illustrated talk on the Shroud of Turin', note: 'Friary Library. Sign the sheet at the back of the church', emoji: '🗣️' }] },
  { date: '2026-11-14', events: [
    { time: '11:00am', title: 'Christmas Market', note: 'Until 2:00pm. Parish Hall. Tables £15', emoji: '🎄' },
    { time: '7:00pm', title: 'Music and Spice Night', note: 'In aid of HCPT. Parish Hall. Tickets £12 including supper', emoji: '🎶' }] },
  { date: '2026-11-21', events: [{ time: '7:00pm', title: 'Talia Dean, Christian Singer', emoji: '🎤' }] },
  { date: '2026-11-27', events: [{ time: '6:00pm', title: 'Christmas Flower Workshop 1', note: 'Until 8:00pm. Sign up after Mass', emoji: '💐' }] },
  { date: '2026-11-28', events: [{ time: '11:00am', title: 'Christmas Flower Workshop 2', note: 'Until 1:00pm. Sign up after Mass', emoji: '💐' }] },
  { date: '2026-12-05', events: [{ time: 'Time to be confirmed', title: 'Parish and School Christmas Fayre', note: 'Our Lady of Compassion', emoji: '🎁' }] },
  { date: '2027-01-23', events: [{ time: '7:00pm', title: 'Race Night', emoji: '🏇' }] },
  { date: '2027-02-21', events: [{ time: '2:00pm', title: 'Afternoon Tea Dance', emoji: '☕' }] },
  { date: '2027-03-20', events: [{ time: '7:00pm', title: 'Irish Night', emoji: '☘️' }] }
];

function toDate(key) { return new Date(key + 'T12:00:00Z'); }
function weekStart(key) {
  const d = toDate(key);
  d.setUTCDate(d.getUTCDate() - d.getUTCDay());
  return d.toISOString().slice(0, 10);
}
function periodKey(key, view) { return view === 'week' ? weekStart(key) : key.slice(0, 7); }
function periodLabel(period, view) {
  if (view === 'month') {
    const [y, m] = period.split('-');
    return MONTHS[Number(m) - 1] + ' ' + y;
  }
  const start = toDate(period);
  const end = new Date(start.getTime());
  end.setUTCDate(end.getUTCDate() + 6);
  const from = start.getUTCDate() + (start.getUTCMonth() === end.getUTCMonth() ? '' : ' ' + MONTHS[start.getUTCMonth()]);
  return from + ' to ' + end.getUTCDate() + ' ' + MONTHS[end.getUTCMonth()];
}
function dayHeading(key) {
  const d = toDate(key);
  const text = WEEKDAYS[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()];
  return key === TODAY ? 'Today, ' + text : text;
}

class Component extends DCLogic {
  state = { view: 'week', index: 0 };

  renderVals() {
    const { view, index } = this.state;
    const periods = [...new Set(DAYS.map((d) => periodKey(d.date, view)))];
    const period = periods[index];
    return {
      weekBg: view === 'week' ? '#F5B82E' : '#FFFFFF',
      monthBg: view === 'month' ? '#F5B82E' : '#FFFFFF',
      periodLabel: periodLabel(period, view),
      prevVisible: index > 0 ? 'visible' : 'hidden',
      nextVisible: index < periods.length - 1 ? 'visible' : 'hidden',
      showWeeks: () => this.setState({ view: 'week', index: 0 }),
      showMonths: () => this.setState({ view: 'month', index: 0 }),
      previous: () => this.setState({ index: Math.max(0, index - 1) }),
      next: () => this.setState({ index: Math.min(periods.length - 1, index + 1) }),
      days: DAYS.filter((d) => periodKey(d.date, view) === period).map((d) => ({ ...d, heading: dayHeading(d.date) }))
    };
  }
}
</script>
</body>
</html>
